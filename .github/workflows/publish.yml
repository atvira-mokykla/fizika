name: Publish physics lessons
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Expand original sources in temporary build workspace
        run: |
          if [ -f bootstrap-pilot.py ]; then
            python bootstrap-pilot.py
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r tools/requirements.txt
      - name: Build and check the four lessons
        run: |
          python tools/build_thermal_pilot.py
          python tools/validate_thermal_pilot.py
          node tools/test_quantity_checker.mjs
      - name: Package editable original sources
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          paths = [Path("physics-starter/content"), Path("physics-starter/schema"), Path("physics-starter/review"), Path("physics-starter/site/assets"), Path("tools"), Path("curriculum"), Path("physics-starter/README.md"), Path("README.md"), Path("LICENSE"), Path("LICENSE-CONTENT.md")]
          with ZipFile("physics-starter/site/downloads/physics-original-sources.zip", "w", ZIP_DEFLATED) as archive:
              for path in paths:
                  files = path.rglob("*") if path.is_dir() else [path]
                  for file in files:
                      if file.is_file() and "__pycache__" not in file.parts:
                          archive.write(file, str(file))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: physics-starter/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
