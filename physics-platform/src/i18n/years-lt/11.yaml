units:
  topic-1:
    title: Fizikos mokslas, metodai ir matavimai
    goals:
    - Paaiškinti ir taikyti temą „Fizikos mokslo raida“.
    - Paaiškinti ir taikyti temą „Pažinimo metodai ir kalba“.
    - Paaiškinti ir taikyti temą „Matavimai ir skaičiavimai fizikoje“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-2:
    title: Judėjimas ir jėgos
    goals:
    - Paaiškinti ir taikyti temą „Judėjimas“.
    - Paaiškinti ir taikyti temą „Jėgos“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-3:
    title: Judesio kiekis ir impulsas
    goals:
    - Paaiškinti ir taikyti temą „Judesio kiekis ir jėgos impulsas“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-4:
    title: Energija, darbas, galia
    goals:
    - Paaiškinti ir taikyti temą „Energija, darbas, galia“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-5:
    title: Mikro ir makro pasaulis, termodinamika
    goals:
    - Paaiškinti ir taikyti temą „Ryšys tarp mikro ir makro pasaulio“.
    - Paaiškinti ir taikyti temą „Termodinamika“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-6:
    title: Elektriniai ir magnetiniai reiškiniai, energijos šaltiniai
    goals:
    - Paaiškinti ir taikyti temą „Elektrostatinis laukas“.
    - Paaiškinti ir taikyti temą „Elektros srovė metaluose“.
    - Paaiškinti ir taikyti temą „Elektros srovės šaltiniai“.
    - Paaiškinti ir taikyti temą „Magnetinis laukas“.
    - Paaiškinti ir taikyti temą „Elektromagnetinė indukcija“.
    - Paaiškinti ir taikyti temą „Energijos šaltiniai“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  autumn-practice:
    title: Tyrimai, kartojimas ir vertinimas
    goals:
    - Remtis įrodymais, paaiškinti prielaidas ir tobulinti rašytinį sprendimą.
    needs:
    - Šio pusmečio temos.
  spring-practice:
    title: Tyrimai, kartojimas ir vertinimas
    goals:
    - Remtis įrodymais, paaiškinti prielaidas ir tobulinti rašytinį sprendimą.
    needs:
    - Šio pusmečio temos.
