units:
  topic-1:
    title: Svyravimai, bangos ir kintamoji srovė
    goals:
    - Paaiškinti ir taikyti temą „Svyravimai“.
    - Paaiškinti ir taikyti temą „Bangos“.
    - Paaiškinti ir taikyti temą „Bangų savybės“.
    - Paaiškinti ir taikyti temą „Kintamoji elektros srovė ir jos perdavimas“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-2:
    title: Geometrinė ir banginė optika
    goals:
    - Paaiškinti ir taikyti temą „Geometrinė optika“.
    - Paaiškinti ir taikyti temą „Banginiai šviesos reiškiniai“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-3:
    title: Kvantinė optika, atomas, branduolys ir dalelės
    goals:
    - Paaiškinti ir taikyti temą „Kvantinė optika“.
    - Paaiškinti ir taikyti temą „Atomo sandara“.
    - Paaiškinti ir taikyti temą „Atomo branduolys ir radioaktyvumas“.
    - Paaiškinti ir taikyti temą „Elementariosios dalelės“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-4:
    title: Reliatyvumo teorija
    goals:
    - Paaiškinti ir taikyti temą „Įvadas į reliatyvumo teoriją“.
    - Paaiškinti ir taikyti temą „Reliatyvistinė mechanika“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  autumn-practice:
    title: Tyrimai, kartojimas ir vertinimas
    goals:
    - Remtis įrodymais, paaiškinti prielaidas ir tobulinti rašytinį sprendimą.
    needs:
    - Šio pusmečio temos.
  spring-practice:
    title: Tyrimai, kartojimas ir vertinimas
    goals:
    - Remtis įrodymais, paaiškinti prielaidas ir tobulinti rašytinį sprendimą.
    needs:
    - Šio pusmečio temos.
