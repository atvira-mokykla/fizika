name: Publish physics lessons
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r tools/requirements.txt PyYAML
          cd physics-platform
          npm ci
      - name: Preserve the original pilot edition
        run: |
          python tools/build_thermal_pilot.py
          python tools/validate_thermal_pilot.py
          node tools/test_quantity_checker.mjs
      - name: Check and build the bilingual platform
        working-directory: physics-platform
        run: |
          npm test
          npm run check
          npm run build
          python scripts/stage-publication.py
          python scripts/check-physics.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: physics-platform/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
