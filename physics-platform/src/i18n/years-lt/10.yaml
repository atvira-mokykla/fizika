units:
  topic-1:
    title: Mechaniniai svyravimai ir bangos
    goals:
    - Paaiškinti ir taikyti temą „Mechaniniai svyravimai“.
    - Paaiškinti ir taikyti temą „Mechaninės bangos“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-2:
    title: Nuolatiniai magnetai ir magnetinis laukas
    goals: &id001
    - Paaiškinti ir taikyti temą „Nuolatiniai magnetai“.
    - Paaiškinti ir taikyti temą „Elektros srovė ir magnetinis laukas“.
    needs: &id002
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-3:
    title: Elektros energijos gamyba
    goals:
    - Paaiškinti ir taikyti temą „Elektros energijos gamyba ir naudojimas“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-4:
    title: Elektromagnetiniai virpesiai ir bangos
    goals:
    - Paaiškinti ir taikyti temą „Elektromagnetiniai virpesiai“.
    - Paaiškinti ir taikyti temą „Elektromagnetinės bangos ir jų savybės“.
    needs:
    - Matuoti dydžius ir nurodyti vienetus; skaityti lenteles ir grafikus.
  topic-2-spring:
    title: Srovė, magnetinis laukas ir indukcija
    goals: *id001
    needs: *id002
  autumn-practice:
    title: Tyrimai, kartojimas ir vertinimas
    goals:
    - Remtis įrodymais, paaiškinti prielaidas ir tobulinti rašytinį sprendimą.
    needs:
    - Šio pusmečio temos.
  spring-practice:
    title: Tyrimai, kartojimas ir vertinimas
    goals:
    - Remtis įrodymais, paaiškinti prielaidas ir tobulinti rašytinį sprendimą.
    needs:
    - Šio pusmečio temos.
